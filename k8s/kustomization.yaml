apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - service.yaml
  - deployment.yaml

# Azure Container Registry. O deploy grava o SHA do commit em newTag e aplica este manifest.
images:
  - name: fiap-users-api
    newName: fcgcontainerregistry.azurecr.io/fiap-users-api
    newTag: "0.1.0"
