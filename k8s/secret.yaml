# Secrets para a API
# IMPORTANTE: Armazena dados SENSÍVEIS (connection strings, chaves de API, senhas)
# Em produção, use um gerenciador de secrets externo!
apiVersion: v1
kind: Secret
metadata:
  name: users-api-secrets
  namespace: fiap-cloud-games
  labels:
    app.kubernetes.io/name: users-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: fiap-cloud-games
type: Opaque
stringData:
  # IMPORTANTE: Substitua esses valores em produção!
  # Use um gerenciador de secrets
  ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FiapCloudGamesDb;User Id=SA;Password=Mysql2022!;TrustServerCertificate=True"
  Jwt__Key: "minha-chave-jwt-super-secreta-2026-api-segura"
  Jwt__Issuer: "FiapCloudGames"
  Jwt__Audience: "FiapCloudGames"
  
  # RabbitMQ - Credenciais
  RabbitMq__Username: "admin"
  RabbitMq__Password: "rabbitmq123"

---
# Secrets para o SQL Server
# IMPORTANTE: Armazena dados SENSÍVEIS
apiVersion: v1
kind: Secret
metadata:
  name: sqlserver-secrets
  namespace: fiap-cloud-games
  labels:
    app.kubernetes.io/name: sqlserver
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: fiap-cloud-games
type: Opaque
stringData:
  MSSQL_SA_PASSWORD: "Mysql2022!"
